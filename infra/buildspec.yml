version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - python3 -m venv /tmp/pkb-native
      - |
        python3 - <<'PY'
        from pathlib import Path
        lines = Path('requirements-cloud.lock').read_text().splitlines()
        versions = [line.split(' --hash=')[0] for line in lines if line and not line.startswith('#')]
        Path('/tmp/pkb-cloud-versions.txt').write_text('\n'.join(versions) + '\n')
        PY
      - '/tmp/pkb-native/bin/python -m pip install --only-binary=:all: --disable-pip-version-check -r requirements-cloud-test.txt -r infra/requirements.txt -c /tmp/pkb-cloud-versions.txt'
  pre_build:
    commands:
      - /tmp/pkb-native/bin/python tools/lint_infra.py infra/foundation.template.json infra/bootstrap.template.json infra/application.template.json infra/native-pipeline.template.json
      - /tmp/pkb-native/bin/python -m unittest tests.test_cloud_storage tests.test_cloud_auth tests.test_cloud_http tests.test_cloud_lambda tests.test_cloud_seed tests.test_cloud_deploy tests.test_cloud_build tests.test_cloud_native tests.test_cloud_operator tests.test_cloud_lint -v
  build:
    commands:
      - |
        aws cloudformation deploy \
          --region ap-southeast-2 \
          --stack-name pkb-dev-foundation \
          --template-file infra/foundation.template.json \
          --capabilities CAPABILITY_NAMED_IAM \
          --role-arn "$CFN_EXECUTION_ROLE_ARN" \
          --parameter-overrides ProjectName=pkb Environment=dev \
            EnablePointInTimeRecovery=true LogRetentionDays=14 \
            "ExecutionRolePermissionsBoundaryArn=$RUNTIME_BOUNDARY_ARN" \
            "AuthSecretArn=$AUTH_SECRET_ARN" ApprovedEmbeddingModelArn= \
          --tags Project=pkb Environment=dev ManagedBy=CloudFormation \
          --no-fail-on-empty-changeset
      - /tmp/pkb-native/bin/python tools/build_cloud_release.py --output /tmp/pkb-cloud-release.zip
      - /tmp/pkb-native/bin/python tools/deploy_cloud_app.py /tmp/pkb-cloud-release.zip
